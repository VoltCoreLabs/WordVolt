name: Release

# A tag `vX.Y.Z[-suffix]` builds WordVolt for Windows (installer + portable), macOS and Linux and
# publishes a GitHub release with the packages (a pre-release when the tag has a suffix).
# Changes to this file or the installers only build the packages (no release).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "installer/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (installer + portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "numeric=$(echo "${v%%-*}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || echo 0.0.0).0" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p wordvolt
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/wordvolt.exe dist/WordVolt.exe
          powershell -Command "Compress-Archive -Path dist/WordVolt.exe -DestinationPath dist/WordVolt-${{ steps.v.outputs.version }}-windows-x64-portable.zip"
      - name: Installer
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=${{ steps.v.outputs.version }}" "//DNumericVersion=${{ steps.v.outputs.numeric }}" installer/windows/wordvolt.iss
          rm dist/WordVolt.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    name: macOS (app in a dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p wordvolt
      - name: Package
        run: |
          app="dist/WordVolt.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/wordvolt "$app/Contents/MacOS/wordvolt"
          sed "s/@VERSION@/$(echo '${{ steps.v.outputs.version }}' | sed 's/-.*//; s/^dev$/0.0.0/')/" installer/macos/Info.plist > "$app/Contents/Info.plist"
          # The icon: a set of sizes made from the logo.
          mkdir icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/brand/logo.png --out icon.iconset/icon_${s}x${s}.png > /dev/null
            sips -z $((s*2)) $((s*2)) assets/brand/logo.png --out icon.iconset/icon_${s}x${s}@2x.png > /dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/icon.icns"
          hdiutil create -volname WordVolt -srcfolder "$app" -ov -format UDZO \
            "dist/WordVolt-${{ steps.v.outputs.version }}-macos-arm64.dmg"
          rm -rf "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux:
    name: Linux (tar.gz + deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libwayland-dev libx11-xcb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libssl-dev libzstd-dev \
            libvulkan-dev pkg-config cmake clang
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: cargo build --release -p wordvolt
      - name: Package
        run: |
          v='${{ steps.v.outputs.version }}'
          mkdir -p dist pkg/WordVolt
          strip target/release/wordvolt || true
          cp target/release/wordvolt installer/linux/wordvolt.desktop assets/brand/logo.png LICENSE pkg/WordVolt/
          tar -czf "dist/WordVolt-$v-linux-x86_64.tar.gz" -C pkg WordVolt
          # .deb: /usr/bin/wordvolt, the menu entry and the icon.
          deb=pkg/deb
          mkdir -p $deb/DEBIAN $deb/usr/bin $deb/usr/share/applications $deb/usr/share/pixmaps
          cp target/release/wordvolt $deb/usr/bin/wordvolt
          cp installer/linux/wordvolt.desktop $deb/usr/share/applications/wordvolt.desktop
          cp assets/brand/logo.png $deb/usr/share/pixmaps/wordvolt.png
          debv=$(echo "$v" | sed 's/^dev$/0.0.0/; s/-/~/')
          cat > $deb/DEBIAN/control <<EOF
          Package: wordvolt
          Version: $debv
          Section: editors
          Priority: optional
          Architecture: amd64
          Maintainer: VoltCoreLabs <noreply@github.com>
          Depends: libc6, libfontconfig1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libvulkan1
          Description: A word processor in pure Rust
           WordVolt: pages, styles, tables, pictures, footnotes, comments, tracked changes,
           .docx and PDF.
          EOF
          sed -i 's/^          //' $deb/DEBIAN/control
          dpkg-deb --build --root-owner-group $deb "dist/WordVolt-$v-linux-amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="docs/releases/${tag#v}.md"
          [ -f "$notes" ] || notes=docs/releases/default.md
          flags=""
          [[ "$tag" == *-* ]] && flags="--prerelease"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$tag" dist/* $flags --title "WordVolt $(echo "${tag#v}" | sed 's/-/ /')" --notes-file "$notes"
